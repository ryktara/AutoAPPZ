packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"

# Native/binary postinstall scripts we explicitly allow (pnpm 11 build approval).
allowBuilds:
  electron: true
  esbuild: true
  # better-sqlite3 ships N-API prebuilds; never run its node-gyp fallback.
  better-sqlite3: false

# @electron/rebuild (via electron-forge) resolves @electron/node-gyp from git.
blockExoticSubdeps: false

minimumReleaseAgeExclude:
  - "@ai-sdk/anthropic@4.0.54"
  - "@ai-sdk/gateway@4.0.82"
  - "@ai-sdk/google@4.0.72"
  - "@ai-sdk/openai-compatible@3.0.49"
  - "@ai-sdk/openai@4.0.67"
  - "@ai-sdk/provider-utils@5.0.41"
  - "@ai-sdk/provider@4.0.15"
  - "@ai-sdk/xai@5.0.0"
  - ai@7.0.102
