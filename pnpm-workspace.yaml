packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"

# Native/binary postinstall scripts we explicitly allow (pnpm 11 build approval).
allowBuilds:
  electron: true
  esbuild: true
  # better-sqlite3 ships N-API prebuilds; never run its node-gyp fallback.
  better-sqlite3: false

# @electron/rebuild (via electron-forge) resolves @electron/node-gyp from git.
blockExoticSubdeps: false
