name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · format · unit · clean-room
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm clean-room:check
      - run: pnpm test -- --coverage

  matrix:
    name: unit · ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: e2e · ${{ matrix.os }}
    needs: check
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoappz/desktop build
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run -a pnpm test:e2e
        if: runner.os == 'Linux'
      - run: pnpm test:e2e
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          retention-days: 5
