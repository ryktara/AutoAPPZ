name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · format · unit · clean-room
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm clean-room:check
      - run: pnpm test -- --coverage

  matrix:
    name: unit · ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  templates:
    name: template portability · ${{ matrix.template }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        template: [react-vite, fullstack-postgres, nextjs, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Copy the template out of the workspace so it must stand entirely on its own.
      - run: |
          cp -r templates/${{ matrix.template }} "$RUNNER_TEMP/tpl"
          rm -f "$RUNNER_TEMP/tpl/template.json"
          cd "$RUNNER_TEMP/tpl"
          grep -q "@autoappz" package.json && { echo "template depends on @autoappz"; exit 1; } || true
          pnpm install
          pnpm build
          pnpm test

  template-postgres:
    name: template fullstack-postgres · local PostgreSQL
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      AUTOAPPZ_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # The integrations package runs its real-PostgreSQL tests when AUTOAPPZ_TEST_DATABASE_URL is set.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/integrations
      # The template must migrate, pass its API tests against the database, and build on its own.
      - run: |
          cp -r templates/fullstack-postgres "$RUNNER_TEMP/tpl"
          rm -f "$RUNNER_TEMP/tpl/template.json"
          cd "$RUNNER_TEMP/tpl"
          grep -q "@autoappz" package.json && { echo "template depends on @autoappz"; exit 1; } || true
          pnpm install
          pnpm db:migrate
          pnpm test
          pnpm build

  docker-build:
    name: docker image · ${{ matrix.template }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        template: [react-vite, fullstack-postgres, nextjs, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Every template ships the Dockerfile the Docker deployment target would generate; it must build on its own.
      - run: docker build --tag autoappz-template-${{ matrix.template }} templates/${{ matrix.template }} 2>&1 | tee build.log
        shell: bash
      # Logs need a signed-in viewer; the step summary is public, so surface the failure tail there.
      - if: failure()
        shell: bash
        run: |
          { echo '## docker build (last 120 lines)'; echo '```'; tail -n 120 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e · ${{ matrix.os }}
    needs: check
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoappz/desktop build 2>&1 | tee build.log
        shell: bash
      # Electron is driven directly; only the browser system dependencies are needed on Linux.
      - run: pnpm --filter @autoappz/e2e exec playwright install --with-deps chromium 2>&1 | tee install.log
        shell: bash
      - run: xvfb-run -a pnpm test:e2e 2>&1 | tee e2e.log
        shell: bash
        if: runner.os == 'Linux'
      - run: pnpm test:e2e 2>&1 | tee e2e.log
        shell: bash
        if: runner.os != 'Linux'
      - if: failure()
        shell: bash
        run: |
          for f in build.log install.log e2e.log; do
            [ -f "$f" ] || continue
            { echo "## $f (last 150 lines)"; echo '```'; tail -n 150 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          retention-days: 5
