name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: verify · clean install, checks, licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Release builds never use a dependency cache: a clean, lockfile-pinned install every time.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm clean-room:check
      - run: node tools/license-notice.mjs --check
      - uses: actions/upload-artifact@v6
        with:
          name: notices
          path: |
            NOTICE-THIRD-PARTY.md
            sbom.cdx.json

  build:
    name: package · ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Signing runs only when the secrets are configured; unsigned artifacts are still produced and attested.
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
      WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MAC_CERT_P12_BASE64 != ''
        run: |
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      - name: Write Windows signing certificate
        if: runner.os == 'Windows' && env.WIN_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          "WIN_CERT_PFX=$env:RUNNER_TEMP\cert.pfx" >> $env:GITHUB_ENV
      - run: pnpm --filter @autoappz/desktop make
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: apps/desktop/out/make/**/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}
          path: apps/desktop/out/make/**/*
          retention-days: 14

  draft-release:
    name: draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Verify assets
        run: |
          find artifacts -type f | sort
          test "$(find artifacts -type f -name '*.zip' | wc -l)" -ge 3
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*
